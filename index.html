<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080D14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Amaterasu X" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Amaterasu X" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <title>AMATERASU X · AI Powered Forex & CFD Signals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <div class="app">
    <!-- Top Telemetry Status -->
    <div class="telemetry-bar">
      <div class="node"><i></i> Amaterasu Node · 12ms</div>
      <div>MT5 Verified Engine</div>
    </div>

    <!-- Top Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon-wrap" id="brandCrest">
          <!-- Amaterasu X Mangekyo Sharingan Vector Crest -->
          <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
            <defs>
              <radialGradient id="amaterasuCrestGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FF2638" stop-opacity="0.9"/>
                <stop offset="65%" stop-color="#EF2D3D" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#080D14" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="sharinganRed" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FF4D5A"/>
                <stop offset="55%" stop-color="#EF2D3D"/>
                <stop offset="95%" stop-color="#9C0E1A"/>
              </radialGradient>
            </defs>
            <!-- Outer Glow Halo -->
            <circle cx="24" cy="24" r="23" fill="url(#amaterasuCrestGlow)" />
            <!-- Outer Eye Ring -->
            <circle cx="24" cy="24" r="19" fill="url(#sharinganRed)" stroke="#FF2638" stroke-width="1.2" />
            <circle cx="24" cy="24" r="19" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.6"/>
            <!-- Inner Ring -->
            <circle cx="24" cy="24" r="14.5" fill="none" stroke="#2b0005" stroke-width="0.8" opacity="0.7"/>
            <!-- Itachi Mangekyo 3-Blade Curved Pinwheel -->
            <g fill="#05070B" stroke="#05070B" stroke-width="0.5">
              <!-- Central Pupil -->
              <circle cx="24" cy="24" r="4.2" fill="#05070B"/>
              <!-- Blade 1 (Top) -->
              <path d="M24 24 Q21 13 24 6 Q27 12 25.5 21 Z" />
              <!-- Blade 2 (Bottom-Right ~120 deg) -->
              <path d="M24 24 Q34 29 39.5 35 Q30 36 25 26.5 Z" />
              <!-- Blade 3 (Bottom-Left ~240 deg) -->
              <path d="M24 24 Q14 29 8.5 35 Q18 36 23 26.5 Z" />
            </g>
            <!-- Core Pupil Glint -->
            <circle cx="24" cy="24" r="1.8" fill="#FF2638"/>
            <circle cx="23" cy="23" r="0.6" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <div class="brand-name" id="brandName">AMATERASU<span class="brand-x">X</span></div>
          <div class="brand-tag" id="brandTag">AI POWERED SIGNALS</div>
        </div>
      </div>

      <div class="ticker">
        <div style="font-size:10px; font-weight:800; color:#EF2D3D; text-align:right; letter-spacing:0.5px;" id="tickerSymbol">XAUUSD</div>
        <div id="price" style="letter-spacing: -0.5px;">3,995.81</div>
        <div id="change" class="change down">-0.71%</div>
      </div>
    </header>

    <!-- User Operator Bar -->
    <div class="userbar">
      <div class="user-pill" style="display:flex; align-items:center; gap:6px;">
        <img src="img/itachi_avatar.jpg" style="width:20px; height:20px; border-radius:50%; object-fit:cover; border:1.5px solid #EF2D3D; box-shadow:0 0 8px rgba(239,45,61,0.5);" alt="Itachi Avatar" />
        <span style="font-size:10px; color:#A0A6B4;">OPERATOR:</span> <b id="user" style="color:#FFF;">Tengku Khairi</b>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="soundToggleBtn" style="font-size:12px; color:#A0A6B4; display:flex; align-items:center; gap:4px; cursor:pointer;" title="Toggle Amaterasu FX Sound">
          <span id="soundIcon">🔊</span> <span style="font-size:11px;">Sound</span>
        </button>
        <a href="#" id="logout" style="font-size:11px; color:#EF2D3D; font-weight:700; border-bottom:1px dashed rgba(239,45,61,0.4);">Log Keluar</a>
      </div>
    </div>

    <!-- Main Content Container -->
    <main id="main"></main>

    <!-- Floating Amaterasu Solar Core (AI Assistant) -->
    <button class="bot" id="bot" aria-label="Amaterasu Solar Core AI">
      <svg viewBox="0 0 64 64" width="58" height="58">
        <defs>
          <radialGradient id="amaterasuOrbGlow" cx="45%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#FF4D5A"/>
            <stop offset="65%" stop-color="#EF2D3D"/>
            <stop offset="100%" stop-color="#3B050B"/>
          </radialGradient>
          <filter id="solarBloom" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- Outer Aura -->
        <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(239, 45, 61, 0.45)" stroke-width="1.5" stroke-dasharray="6 4" />
        <circle cx="32" cy="32" r="23" fill="none" stroke="rgba(255, 38, 56, 0.6)" stroke-width="1.2" />
        <!-- Core Sharingan Orb -->
        <circle cx="32" cy="32" r="17" fill="url(#amaterasuOrbGlow)" filter="url(#solarBloom)" />
        <!-- Pinwheel Silhouette -->
        <circle cx="32" cy="32" r="4" fill="#080D14" />
        <path d="M32 32 Q29 20 32 16 Q35 22 33.5 29 Z" fill="#080D14" />
        <path d="M32 32 Q42 37 45 42 Q37 42 33 34 Z" fill="#080D14" />
        <path d="M32 32 Q22 37 19 42 Q27 42 31 34 Z" fill="#080D14" />
        <circle cx="30" cy="30" r="2.5" fill="#ffffff" opacity="0.8" />
      </svg>
    </button>

    <!-- Floating Navigation Dock -->
    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <script src="js/core.js?v=3.7"></script>
  <script src="js/shadow-path.js?v=3.7"></script>
  <script src="js/blocks.js?v=3.7"></script>
  <script src="js/pages-main.js?v=3.7"></script>
  <script src="js/pages-more.js?v=3.7"></script>
  <script src="js/app.js?v=3.7"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW registration note:', err));
      });
    }
  </script>
</body>
</html>
